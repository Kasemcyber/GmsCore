name: Build Huawei -hw

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: GmsCore + AndroidVending -hw
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          echo "===== Java ====="
          java -version

          echo ""
          echo "===== Gradle ====="
          ./gradlew --version

          echo ""
          echo "===== Commit ====="
          git log -1 --oneline

      - name: Build Release
        run: |
          ./gradlew --no-daemon assembleRelease

      - name: Find Huawei APKs
        run: |
          echo "===== Huawei APKs ====="

          find . \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*-hw.apk" \
            -print

      - name: Collect Huawei APKs
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          find . \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*-hw.apk" \
            -exec cp {} artifacts/ \;

          echo ""
          echo "===== Files ====="
          ls -lh artifacts/

      - name: Verify APK signatures
        run: |
          echo "===== APK signatures ====="

          for apk in artifacts/*.apk; do
            echo ""
            echo "========================================"
            echo "$apk"
            echo "========================================"

            apksigner verify \
              --verbose \
              --print-certs \
              "$apk"
          done

      - name: Calculate SHA-256
        run: |
          echo "===== SHA-256 ====="
          sha256sum artifacts/*.apk

      - name: Upload Huawei APKs
        uses: actions/upload-artifact@v4
        with:
          name: microg-huawei-hw
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
