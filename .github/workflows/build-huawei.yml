name: Build Huawei -hw

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GmsCore + AndroidVending
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Release
        run: |
          ./gradlew --no-daemon assembleRelease

      - name: Show all APKs
        run: |
          echo "===== ALL APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Collect Huawei APKs
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          find . \
            -type f \
            -name "*-hw.apk" \
            -exec cp {} artifacts/ \;

          echo ""
          echo "===== COLLECTED APKs ====="
          ls -lah artifacts/

      - name: Verify APK signatures
        run: |
          for apk in artifacts/*.apk; do
            echo ""
            echo "========================================"
            echo "$apk"
            echo "========================================"

            apksigner verify \
              --verbose \
              --print-certs \
              "$apk"
          done

      - name: SHA256
        run: |
          echo "===== SHA256 ====="
          sha256sum artifacts/*.apk

      - name: Upload Huawei APKs
        uses: actions/upload-artifact@v4
        with:
          name: microg-huawei-hw
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

